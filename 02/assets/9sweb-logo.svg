<svg class="logo-svg" viewBox="0 0 560 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
          <defs>
<style>
.logo-svg{width:100%;height:auto;display:block;overflow:visible}
.lt{transform-box:fill-box;transform-origin:50% 85%;animation:ltIn .7s cubic-bezier(.34,1.56,.64,1) both,ltBob 2.8s ease-in-out infinite}
.l1{animation-delay:.05s,1s}.l2{animation-delay:.13s,1.15s}.l3{animation-delay:.21s,1.3s}.l4{animation-delay:.29s,1.45s}.l5{animation-delay:.37s,1.6s}
@keyframes ltIn{0%{opacity:0;transform:translateY(-52px) scale(.2) rotate(-14deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes ltBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1.6deg)}}
.sheenband{animation:svgSheen 3.6s ease-in-out 1.4s infinite}
@keyframes svgSheen{0%,55%{transform:translateX(-260px)}90%,100%{transform:translateX(560px)}}
.spark{transform-box:fill-box;transform-origin:50% 50%;animation:sparkTw 2.2s ease-in-out infinite}.spark.s2{animation-delay:.8s;animation-duration:2.8s}.spark.s3{animation-delay:1.4s;animation-duration:3.2s}
@keyframes sparkTw{0%,100%{transform:scale(.55) rotate(0);opacity:.45}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
.gdot{animation:dotBlink 1.9s ease-in-out infinite}.gdot.d2{animation-delay:.6s}.gdot.d3{animation-delay:1.2s}
@keyframes dotBlink{0%,100%{opacity:.35}50%{opacity:1}}
.games-row{display:none}.projects-row{animation:riseIn .6s cubic-bezier(.22,1,.36,1) .55s both}.gstar{transform-box:fill-box;transform-origin:50% 50%;animation:gspin 6s linear infinite}.gstar.g2{animation-direction:reverse}
@keyframes gspin{100%{transform:rotate(360deg)}}
.bub{transform-box:fill-box;transform-origin:12% 96%;animation:bubPop .55s cubic-bezier(.34,1.56,.64,1) 1.05s both,bubBob 3.4s ease-in-out 1.7s infinite}
@keyframes bubPop{0%{opacity:0;transform:scale(0) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes bubBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(1.4deg)}}
@keyframes riseIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
